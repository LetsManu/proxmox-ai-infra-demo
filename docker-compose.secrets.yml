# Optional override: feed secrets as Docker secrets (files) instead of environment variables.
#   mkdir -p secrets && chmod 700 secrets
#   printf '%s' '<proxmox-token-secret>' > secrets/proxmox_token_secret
#   printf '%s' '<anthropic-key>'        > secrets/anthropic_api_key   # create it empty if AI is off
#   cp ~/.ssh/infra-demo secrets/ansible_ssh_key                       # private key for Linux VMs (Ansible)
#   printf '%s' '<12+ chars>'            > secrets/windows_admin_password  # Windows VMs (cloudbase-init + WinRM)
#   touch secrets/proxmox_ssh_key        # optional: node SSH key for cloud-init snippets; empty = off
#   chmod 600 secrets/* && sudo chown 10001:10001 secrets/*   # backend runs as uid 10001 and must read them
# Every file must exist (Compose refuses to start otherwise); an empty file means "not configured".
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# The backend reads VAR_FILE=/run/secrets/<name>; a *_FILE value wins over the plain variable.
# secrets/ is gitignored. Leave PROXMOX_TOKEN_SECRET / ANTHROPIC_API_KEY empty in .env when using this.
secrets:
  proxmox_token_secret: { file: ./secrets/proxmox_token_secret }
  anthropic_api_key: { file: ./secrets/anthropic_api_key }
  ansible_ssh_key: { file: ./secrets/ansible_ssh_key }
  windows_admin_password: { file: ./secrets/windows_admin_password }
  proxmox_ssh_key: { file: ./secrets/proxmox_ssh_key }

services:
  backend:
    secrets: [proxmox_token_secret, anthropic_api_key, ansible_ssh_key, windows_admin_password, proxmox_ssh_key]
    environment:
      PROXMOX_TOKEN_SECRET: !reset null
      ANTHROPIC_API_KEY: !reset null
      WINDOWS_ADMIN_PASSWORD: !reset null
      WINDOWS_ADMIN_PASSWORD_FILE: /run/secrets/windows_admin_password
      ANSIBLE_SSH_KEY_FILE: /run/secrets/ansible_ssh_key
      PROXMOX_SSH_PRIVATE_KEY_FILE: /run/secrets/proxmox_ssh_key
      PROXMOX_TOKEN_SECRET_FILE: /run/secrets/proxmox_token_secret
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
