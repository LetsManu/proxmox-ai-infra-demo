# Bundled draft used by the local (offline) assistant. Still goes through review.
label: WordPress
os_family: linux
description: WordPress served by Nginx + PHP-FPM from /var/www/wordpress
port: 80
tasks_yaml: |
  - name: Download WordPress
    ansible.builtin.get_url:
      url: https://wordpress.org/latest.tar.gz
      dest: /tmp/wordpress.tar.gz
      mode: "0644"

  - name: Unpack WordPress
    ansible.builtin.unarchive:
      src: /tmp/wordpress.tar.gz
      dest: /var/www
      remote_src: true
      creates: /var/www/wordpress/index.php

  - name: Web server owns WordPress
    ansible.builtin.file:
      path: /var/www/wordpress
      owner: www-data
      group: www-data
      recurse: true

  - name: Nginx site for WordPress
    ansible.builtin.copy:
      dest: /etc/nginx/sites-available/wordpress
      mode: "0644"
      content: |
        server {
          listen 80 default_server;
          root /var/www/wordpress;
          index index.php;
          location / { try_files $uri $uri/ /index.php?$args; }
          location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
          }
        }
    notify: Reload nginx

  - name: Serve WordPress as the default site
    ansible.builtin.file:
      src: /etc/nginx/sites-available/wordpress
      dest: /etc/nginx/sites-enabled/default
      state: link
      force: true
    notify: Reload nginx
handlers_yaml: |
  - name: Reload nginx
    ansible.builtin.service:
      name: nginx
      state: reloaded
tests:
  - {type: http, title: "WordPress answers on port 80", port: 80, path: "/", status: 200, contains: "WordPress"}
  - {type: package_installed, title: "PHP-FPM installed", package: php-fpm}
