# Release: push a tag vX.Y.Z (or vX.Y.Z-rc.N for a release candidate), or run it from the Actions tab on main
# with the version (e.g. 2.1.0-rc.1): then the tag is created on that commit at the very end.
#   1. full CI on the commit
#   2. backend and frontend images to ghcr.io (with SBOM and provenance), tag X.Y.Z[-rc.N]; "latest" for final releases
#   3. the Proxmox appliance disk (appliance/build.sh: Debian 12 + Docker + this version's images)
#   4. GitHub release with the install archive (scripts/install.sh inside), the appliance disk and SHA-256 sums
# Only GitHub's own tooling is used (docker, gh), so there is no third-party action to pin.
name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      version: { description: "Version without v, e.g. 2.1.0-rc.1 (creates tag v<version> on this commit)", required: true }
permissions: { contents: read }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        name: Tag matches the code
        env: { INPUT_VERSION: "${{ inputs.version }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "Run the release from main"; exit 1; }
            tag="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "Tag $tag exists already"; exit 1; fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]] || { echo "Tag $tag is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          base="${BASH_REMATCH[1]}"
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/__init__.py)
          [ "$code" = "$base" ] || { echo "Tag $tag but backend/app/__init__.py says $code"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "${BASH_REMATCH[2]}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  images:
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/proxmox-ai-infra-demo
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          docker buildx create --use --name release
          extra=""
          [ "${{ needs.version.outputs.prerelease }}" = false ] && extra=latest
          for svc in backend frontend; do
            if [ "$svc" = backend ]; then ctx=.; file=backend/Dockerfile; else ctx=frontend; file=frontend/Dockerfile; fi
            tags=(-t "$REGISTRY/$svc:$VERSION")
            [ -n "$extra" ] && tags+=(-t "$REGISTRY/$svc:latest")
            docker buildx build "$ctx" -f "$file" "${tags[@]}" --platform linux/amd64 --push \
              --sbom=true --provenance=mode=max \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=${{ github.sha }}"
          done

  publish:
    needs: [images, version]
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: read }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install archive
        run: |
          name="proxmox-ai-infra-$VERSION"
          echo "$VERSION" > VERSION
          git archive --format=tar.gz --prefix="$name/" --add-file=VERSION -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          base="${VERSION%%-*}"
          awk -v v="$base" '$0 ~ "^## " v " " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`bash
          tar xzf $name.tar.gz && cd $name
          scripts/install.sh
          \`\`\`

          Upgrade an existing installation: extract over it, then \`scripts/upgrade.sh\`. Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proxmox-ai-infra-demo/{backend,frontend}:$VERSION\`.

          ## Proxmox appliance

          \`proxmox-ai-infra-appliance-$VERSION.qcow2\`: Debian 12 with Docker and this version, ready to import. On the Proxmox node:

          \`\`\`bash
          ./import-to-proxmox.sh --image proxmox-ai-infra-appliance-$VERSION.qcow2 --ssh-key ~/.ssh/id_ed25519.pub --start
          ssh admin@<vm-ip>   # then: sudo pac-setup
          \`\`\`

          Details: docs/appliance.md.
          EOF
      - name: Appliance disk
        env: { IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}/proxmox-ai-infra-demo" }
        run: |
          IMAGE_REGISTRY=$(echo "$IMAGE_REGISTRY" | tr '[:upper:]' '[:lower:]')
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils xorriso
          # hardware acceleration on GitHub-hosted runners
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for svc in backend frontend; do docker pull -q "$IMAGE_REGISTRY/$svc:$VERSION"; done
          docker pull -q caddy:2.10.2-alpine
          IMAGE_REGISTRY="$IMAGE_REGISTRY" appliance/build.sh "$VERSION" "proxmox-ai-infra-appliance-$VERSION.qcow2"
          size=$(stat -c %s "proxmox-ai-infra-appliance-$VERSION.qcow2")
          [ "$size" -lt 2000000000 ] || { echo "Appliance disk is $size bytes, over the 2 GB release asset limit"; exit 1; }
          sha256sum "proxmox-ai-infra-appliance-$VERSION.qcow2" > "proxmox-ai-infra-appliance-$VERSION.qcow2.sha256"
          cp appliance/import-to-proxmox.sh .
      - name: GitHub release
        run: |
          pre=""
          [ "${{ needs.version.outputs.prerelease }}" = true ] && pre="--prerelease"
          # manual run: GitHub creates the tag on the commit that CI tested and the images were built from
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then where=(--target "$GITHUB_SHA"); else where=(--verify-tag); fi
          gh release create "$TAG" "${where[@]}" --title "$TAG" --notes-file notes.md $pre \
            "proxmox-ai-infra-$VERSION.tar.gz" "proxmox-ai-infra-$VERSION.tar.gz.sha256" \
            "proxmox-ai-infra-appliance-$VERSION.qcow2" "proxmox-ai-infra-appliance-$VERSION.qcow2.sha256" \
            import-to-proxmox.sh
