name: proxmox-ai-infra

# Images: releases publish them to the registry (scripts/install.sh pulls VERSION from .env).
# Without VERSION the tag is "dev" and `docker compose up --build` builds them from this checkout.

# Shared hardening (same baseline as friendflix): non-root, read-only root FS,
# no Linux capabilities, no privilege escalation, rotated logs.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  backend:
    <<: *hardening
    tmpfs: [/tmp]
    image: ${IMAGE_REGISTRY:-ghcr.io/letsmanu/proxmox-ai-infra-demo}/backend:${VERSION:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false # no .env = safe defaults = mock mode
    environment:
      DATABASE_URL: sqlite:////data/app.db
      WORKSPACE_DIR: /workspace
      INFRA_DIR: /app/infra
      EXTRA_PROFILE_DIRS: ${EXTRA_PROFILE_DIRS:-/profiles}
    volumes:
      - app-data:/data          # SQLite deployment history
      - tf-workspace:/workspace # separate TEST/PROD Terraform state + plans
      - ${PROFILES_DIR:-./profiles}:/profiles:ro # project software profiles (Ansible roles), re-read live
      - ${CERTS_DIR:-./certs}:/certs:ro # optional CA certificates, e.g. LDAP_CA_FILE=/certs/ldap-ca.crt
    ports:
      # Bound to localhost only; the browser talks to the API through the frontend proxy.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # curl, not a Python process: a cold interpreter alone can take seconds on a busy or slow host
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    <<: *hardening
    tmpfs: [/tmp]
    image: ${IMAGE_REGISTRY:-ghcr.io/letsmanu/proxmox-ai-infra-demo}/frontend:${VERSION:-dev}
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  tf-workspace:
