# Runs declarative acceptance checks inside a VM (see backend/app/services/test_service.py).
# `checks` is generated by the console; every field was validated against a strict
# schema before it reaches this playbook. Each check prints exactly one line
#   CHECK|<n>|PASS|<detail>   or   CHECK|<n>|FAIL|<detail>
# where <n> is the check's position in `checks`. The position, not the check id, is
# echoed back: Ansible turns an all-digit id like 00523341 into a number (octal).
# and never fails the play, so one broken check does not hide the others.

- name: Acceptance checks (Linux)
  hosts: linux
  become: true
  gather_facts: false
  tasks:
    - name: Run checks
      ansible.builtin.include_tasks: checks/run.yml
      loop: "{{ checks | default([]) }}"
      loop_control:
        loop_var: check
        index_var: check_index
        label: "{{ check.title }}"
      vars:
        family: linux

- name: Acceptance checks (Windows)
  hosts: windows
  gather_facts: false
  tasks:
    - name: Run checks
      ansible.builtin.include_tasks: checks/run.yml
      loop: "{{ checks | default([]) }}"
      loop_control:
        loop_var: check
        index_var: check_index
        label: "{{ check.title }}"
      vars:
        family: windows
