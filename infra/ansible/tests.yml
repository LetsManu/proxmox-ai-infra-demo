# Runs declarative acceptance checks inside a VM (see backend/app/services/test_service.py).
# `checks` is generated by the console; every field was validated against a strict
# schema before it reaches this playbook. Each check prints exactly one line
#   CHECK|<id>|PASS|<detail>   or   CHECK|<id>|FAIL|<detail>
# and never fails the play, so one broken check does not hide the others.

- name: Acceptance checks (Linux)
  hosts: linux
  become: true
  gather_facts: false
  tasks:
    - name: Run checks
      ansible.builtin.include_tasks: checks/run.yml
      loop: "{{ checks | default([]) }}"
      loop_control:
        loop_var: check
        label: "{{ check.title }}"
      vars:
        family: linux

- name: Acceptance checks (Windows)
  hosts: windows
  gather_facts: false
  tasks:
    - name: Run checks
      ansible.builtin.include_tasks: checks/run.yml
      loop: "{{ checks | default([]) }}"
      loop_control:
        loop_var: check
        label: "{{ check.title }}"
      vars:
        family: windows
