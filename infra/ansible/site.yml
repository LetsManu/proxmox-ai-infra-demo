# Applies the base role, every selected software profile and the VM's extra packages.
# Profiles are discovered from roles that carry a profile.yml (built-in and project dirs).
# Inventory and `profiles` are generated by the console backend per VM;
# credentials come from the environment (never written to disk).

- name: Configure Linux VMs
  hosts: linux
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until the VM accepts SSH (cloud-init may still be running)
      ansible.builtin.wait_for_connection:
        timeout: 600
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - linux_base
  tasks:
    - name: Apply software profiles
      ansible.builtin.include_role:
        name: "{{ profile }}"
      loop: "{{ profiles | default([]) }}"
      loop_control:
        loop_var: profile
    - name: Install extra packages
      ansible.builtin.include_role:
        name: packages_linux
      when: packages | default([]) | length > 0

- name: Configure Windows VMs
  hosts: windows
  gather_facts: false
  pre_tasks:
    - name: Wait until WinRM answers (cloudbase-init may still be running)
      ansible.builtin.wait_for_connection:
        timeout: 900
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - windows_base
  tasks:
    - name: Apply software profiles
      ansible.builtin.include_role:
        name: "{{ profile }}"
      loop: "{{ profiles | default([]) }}"
      loop_control:
        loop_var: profile
    - name: Install extra packages
      ansible.builtin.include_role:
        name: packages_windows
      when: packages | default([]) | length > 0
