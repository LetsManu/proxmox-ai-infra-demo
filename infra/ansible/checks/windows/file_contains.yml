- name: Read file
  ansible.builtin.slurp:
    src: "{{ check.path }}"
  register: r
  failed_when: false
- name: Evaluate
  ansible.builtin.set_fact:
    check_ok: "{{ r.content is defined and (check.pattern | string) in (r.content | b64decode) }}"
    check_detail: "{{ check.path }} {{ 'contains the text' if r.content is defined and (check.pattern | string) in (r.content | b64decode) else ('does not contain the text' if r.content is defined else 'is missing') }}"
