- name: Query service state
  ansible.builtin.command:
    argv: ["systemctl", "is-active", "{{ check.service }}"]
  register: r
  changed_when: false
  failed_when: false
- name: Evaluate
  ansible.builtin.set_fact:
    check_ok: "{{ r.stdout | trim == 'active' }}"
    check_detail: "{{ check.service }} is {{ r.stdout | trim | default('unknown', true) }}"
