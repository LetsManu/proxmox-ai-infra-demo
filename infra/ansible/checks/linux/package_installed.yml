- name: Query package
  ansible.builtin.command:
    argv: ["dpkg-query", "-W", "-f=${Status} ${Version}", "{{ check.package }}"]
  register: r
  changed_when: false
  failed_when: false
- name: Evaluate
  ansible.builtin.set_fact:
    check_ok: "{{ r.rc == 0 and 'install ok installed' in r.stdout }}"
    check_detail: "{{ check.package }} {{ (r.stdout.split(' ') | last) if r.rc == 0 and 'install ok installed' in r.stdout else 'not installed' }}"
