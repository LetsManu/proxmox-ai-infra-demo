- name: Detect LXC containers (no guest agent; Ansible connects as root with a key)
  ansible.builtin.set_fact:
    is_lxc: "{{ ansible_virtualization_type | default('') == 'lxc' }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ ['unattended-upgrades', 'curl', 'ca-certificates', 'htop'] + ([] if is_lxc else ['qemu-guest-agent']) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable QEMU guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: not is_lxc

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Set timezone to UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    state: link

- name: SSH - keys only, no root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-infra-demo.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin {{ 'prohibit-password' if is_lxc else 'no' }}
      KbdInteractiveAuthentication no
    mode: "0644"
  notify: Restart ssh

- name: Record managed state
  ansible.builtin.copy:
    dest: /etc/infra-demo.json
    content: "{{ {'profiles': profiles | default([]), 'configured_by': 'proxmox-ai-infra-demo'} | to_nice_json }}"
    mode: "0644"
